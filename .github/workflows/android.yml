name: Сборка APK

# APK собирается по тегу и попадает в релиз: держать бинарник в репозитории
# смысла нет, а скачивать его людям нужно.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # нужно, чтобы приложить файл к релизу

jobs:
  build:
    runs-on: ubuntu-latest

    # Секреты в `if` у шага использовать нельзя — контекст secrets там
    # недоступен, и workflow падает на разборе. Поэтому раскрываем их
    # в env один раз на уровне job.
    env:
      NEWDAY_KEYSTORE: ${{ github.workspace }}/release.keystore
      NEWDAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NEWDAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Версия приложения — из тега: v1.2.3 → versionName 1.2.3.
      # versionCode должен монотонно расти, иначе Android не даст обновиться,
      # поэтому считаем его из номера версии: 1.2.3 → 10203.
      - name: Определить версию
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          NAME="${RAW:-0.0.0}"
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          [ "$CODE" -gt 0 ] || CODE=1
          echo "NEWDAY_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "NEWDAY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "версия $NAME (code $CODE)"

      - name: Восстановить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$NEWDAY_KEYSTORE"
            echo "ключ восстановлен"
          else
            # Пусть путь остаётся несуществующим: build.gradle это увидит
            # и подпишет отладочным ключом, а не выдаст неустановимый APK.
            echo "::warning::ANDROID_KEYSTORE_BASE64 не задан, APK будет подписан отладочным ключом"
          fi

      - name: Перенести веб-часть в проект Android
        run: npx cap sync android

      # chmod здесь, а не только в индексе git: проект ведётся с Windows, где
      # бит исполнения не хранится и любой `git add` его сбрасывает. Без этого
      # сборка падает на `./gradlew: Permission denied`.
      - name: Собрать релизный APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Проверить, что APK подписан
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          mv "$APK" "android/app/build/outputs/apk/release/NewDay-$NEWDAY_VERSION_NAME.apk"
          rm -f "$NEWDAY_KEYSTORE"

      - name: Приложить APK к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/NewDay-*.apk
          body: |
            Скачайте APK ниже или соберите сами.

            Установка: разрешите установку из неизвестных источников,
            затем откройте файл. При первом запуске укажите адрес своего
            сервера — по умолчанию приложение смотрит на newday.appswire.ru.

            Будильнику нужны два разрешения, приложение попросит их само:
            точные будильники и показ поверх других окон. Без второго
            экран не включится, если телефон разблокирован.
