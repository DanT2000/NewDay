apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/**
 * «1.2.3» → 10203. Тот же расчёт, что в .github/workflows/android.yml:
 * два места на минорную версию и два на патч. Правило одно, чтобы номер,
 * собранный руками, не разошёлся с номером из CI.
 */
static String versionNameToCode(String name) {
    def parts = (name ?: '0.0.0').split('\\.')
    int ma = parts.length > 0 ? parts[0].toInteger() : 0
    int mi = parts.length > 1 ? parts[1].toInteger() : 0
    int pa = parts.length > 2 ? parts[2].toInteger() : 0
    return String.valueOf(Math.max(1, ma * 10000 + mi * 100 + pa))
}

android {
    /*
     * ru.appswire.newday — и пакет кода, и идентификатор в магазине.
     *
     * Правило простое: идентификатор — это домен владельца, записанный
     * наоборот. Домен здесь appswire.ru, значит ru.appswire.newday. Вариант
     * com.appswire.newday занимал бы appswire.com — чужой домен; вариант
     * com.newday.appswire читается как домен appswire.newday.com, которого
     * не существует.
     *
     * Полезное следствие: сборка с сайта раздавалась под этим же именем,
     * поэтому магазинная встанет обновлением поверх неё — без двух значков
     * и без просьбы «удалите старую версию».
     *
     * namespace (пакет кода: по нему собирается класс R и разрешается
     * «.MainActivity» в манифесте) приходится писать отдельной строкой —
     * AGP 8 требует его явно и из applicationId не выводит. Значение то же.
     */
    namespace "ru.appswire.newday"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.appswire.newday"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * Версия — из окружения, с осмысленными значениями по умолчанию.
         *
         * versionCode должен монотонно расти, иначе магазин отвергнет
         * загрузку; считается он из версии по правилу MA*10000+MI*100+PA,
         * как в CI. «1» по умолчанию было ловушкой: собранный руками релиз
         * уезжал в консоль с кодом 1 и навсегда занимал самый младший номер.
         */
        versionName System.getenv("NEWDAY_VERSION_NAME") ?: "1.0.8"
        versionCode Integer.parseInt(System.getenv("NEWDAY_VERSION_CODE")
                ?: versionNameToCode(versionName))
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    /*
     * Подпись релиза.
     *
     * Android не устанавливает неподписанный APK вообще, поэтому релизная
     * сборка обязана быть подписана хоть чем-то. Ключ берём из переменных
     * окружения или из android/keystore.properties (файл в .gitignore):
     * в репозитории ключу и паролям места нет, а в CI они лежат в секретах.
     *
     * Если ключа нет — подписываем отладочным и громко предупреждаем: собрать
     * себе APK так можно, но выложить в магазин нельзя, и обновить его потом
     * настоящим ключом уже не выйдет — Android откажется из-за несовпадения
     * подписи.
     */
    /*
     * Читаем в UTF-8, а не потоком.
     *
     * Properties.load(InputStream) разбирает файл как ISO-8859-1: путь с
     * русскими буквами («D:/Project/Настройки/…») превращался в мусор, файл
     * ключа «не находился», и релиз молча уходил подписанным отладочным
     * ключом. Такую сборку магазин не примет, а понять почему — негде.
     */
    def ksProps = new Properties()
    def ksPropsFile = rootProject.file('keystore.properties')
    if (ksPropsFile.exists()) ksPropsFile.withReader('UTF-8') { ksProps.load(it) }

    def ksPath = System.getenv("NEWDAY_KEYSTORE") ?: ksProps.getProperty('storeFile')
    def hasKeystore = ksPath && file(ksPath).exists()
    def ksPassword = System.getenv("NEWDAY_KEYSTORE_PASSWORD") ?: ksProps.getProperty('storePassword')
    def ksAlias = System.getenv("NEWDAY_KEY_ALIAS") ?: ksProps.getProperty('keyAlias') ?: "newday"
    def ksKeyPassword = System.getenv("NEWDAY_KEY_PASSWORD") ?: ksProps.getProperty('keyPassword') ?: ksPassword

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
                /*
                 * Обе схемы подписи. v1 нужна установке на Android 6 и 7
                 * (minSdk 23), v2 — всему, что новее; RuStore принимает APK,
                 * подписанный так же, как Play принимает AAB.
                 */
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            /*
             * Отладка вебвью в релизе выключена жёстко.
             *
             * Capacitor включает её сам, когда сборка debuggable, но полагаться
             * на это нельзя: релиз с открытым инспектором — это чужой доступ ко
             * всему, что лежит в приложении, включая токен устройства.
             */
            debuggable false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            } else {
                /*
                 * Громко и в глаза: сборка, подписанная отладочным ключом,
                 * выглядит как настоящая и молча не годится для магазина.
                 * Один раз это уже случилось — путь к ключу с русскими
                 * буквами не прочитался, и APK ушёл с подписью «Android Debug».
                 */
                logger.warn("=".multiply(70))
                logger.warn("NewDay: КЛЮЧ ПОДПИСИ НЕ НАЙДЕН — релиз подписан отладочным ключом.")
                logger.warn("В Google Play и RuStore такую сборку загружать нельзя.")
                logger.warn("Искали: NEWDAY_KEYSTORE в окружении и android/keystore.properties" +
                        (ksPath ? " (путь ${ksPath} не существует)" : " (путь не задан)"))
                logger.warn("Как настроить — PUBLISHING.md")
                logger.warn("=".multiply(70))
                signingConfig signingConfigs.debug
            }
        }
    }

    /*
     * Два магазина — две сборки.
     *
     * Google Play запрещает приложениям обновлять себя в обход магазина:
     * REQUEST_INSTALL_PACKAGES для планировщика там не пройдёт проверку.
     * В RuStore самообновление допустимо и полезно — сайт раздаёт APK.
     * Поэтому разрешение и весь модуль обновления живут только в сборке
     * rustore, а сборка play физически их не содержит: проверяющему нечего
     * найти, а нам нечего объяснять.
     */
    flavorDimensions += "store"
    productFlavors {
        play {
            dimension "store"
            // магазин обновляет сам — просить об этом человека не нужно
            buildConfigField "boolean", "SELF_UPDATE", "false"
            manifestPlaceholders = [selfUpdate: "false"]
        }
        rustore {
            dimension "store"
            buildConfigField "boolean", "SELF_UPDATE", "true"
            manifestPlaceholders = [selfUpdate: "true"]
        }
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    // Камера и чтение кодов — только для задачи пробуждения «QR-код»
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.zxing:core:$zxingVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // В юнит-тестах android.jar — заглушка, где каждый метод кидает
    // RuntimeException, включая org.json. Тестам конфига нужен настоящий.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
