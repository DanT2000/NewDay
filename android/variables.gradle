ext {
    kotlinVersion = '2.1.10'
    /*
     * minSdk 23, а не 22.
     *
     * Android 5.1 — это меньше десятой доли процента устройств, а разрешения
     * там выдаются при установке: код с runtime-запросами камеры и шагомера
     * на нём всё равно работал бы вслепую. Тянуть версию, которую нельзя
     * проверить и на которой половина функций бессмысленна, дороже, чем
     * отказаться от неё.
     *
     * compileSdk и targetSdk 36 (Android 16): с 31 августа 2026 Google Play
     * не принимает обновления с targetSdk ниже 36, а новое приложение имеет
     * смысл публиковать сразу на актуальном — иначе первое же обновление
     * придётся выпускать ради цифры.
     */
    minSdkVersion = 23
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
    // Камера и чтение кодов для задачи пробуждения «QR-код».
    //
    // Взят zxing-core, а не ML Kit: это чистая Java без сервисов Google, она
    // читает код прямо на телефоне, без интернета и без скачивания моделей.
    // Будильник звонит в шесть утра в самолётном режиме — момент, когда
    // «модель ещё не загрузилась», означает, что выключить его нечем.
    cameraxVersion = '1.3.4'
    zxingVersion = '3.5.3'
}