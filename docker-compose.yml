version: '3.9'

services:
  app:
    build: .
    container_name: planner-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/planner.db
      SESSION_SECRET: ${SESSION_SECRET:-change_me_to_long_random_string}
    volumes:
      - planner_data:/app/data

volumes:
  planner_data:
