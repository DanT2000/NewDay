<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NewDay</title>
  <meta name="theme-color" content="#f3f5fe">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    .boot { display: grid; place-items: center; min-height: 100dvh; gap: var(--s-4); }
    .spinner {
      width: 30px; height: 30px; border: 3px solid var(--hairline);
      border-top-color: var(--c-day); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  </style>
  <script src="/js/boot-theme.js"></script>
</head>
<body>
  <div class="boot">
    <img src="/icons/logo-256.png" alt="NewDay" width="64" height="64">
    <div class="spinner" role="status" aria-label="Загрузка"></div>
  </div>
  <script type="module">
    /*
     * Куда идти дальше.
     *
     * Раньше здесь всегда ждали ответа сервера, и без сети ответа не было —
     * человека уводило на страницу входа. В приложении это ровно то, чего
     * быть не должно: в метро вместо своего дня показывалась форма входа,
     * хотя день лежал на устройстве.
     *
     * Сначала смотрим на то, что известно и без сети: токен устройства или
     * сохранённая копия. Есть — открываем день сразу, веб-версия сама покажет
     * спокойную полосу «нет связи» и подхватит свежее, когда связь появится.
     * Нет — только тогда спрашиваем сервер.
     *
     * Ведём в веб-версию и на телефоне тоже: прежние экраны остались от
     * времён, когда она была рисована только под компьютер. Теперь у неё своя
     * телефонная раскладка, и держать два интерфейса значит чинить каждую
     * правку дважды.
     */
    import { me, deviceToken } from '/js/api.js';

    const known = Boolean(deviceToken())
      || Boolean(localStorage.getItem('newday.local.settings'));

    if (known) {
      location.replace('/web.html');
    } else {
      try {
        await me();
        location.replace('/web.html');
      } catch {
        location.replace('/login.html');
      }
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  </script>
</body>
</html>
