<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — NewDay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f3f5fe">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/boot-theme.js"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-icon" src="/icons/logo-light-256.png" alt="NewDay" width="88" height="88">
      <h1 class="auth-logo-title">NewDay</h1>
      <p class="auth-logo-sub">Личный планировщик</p>
    </div>

    <form id="login-form" class="auth-form" autocomplete="on">
      <div class="form-group">
        <label for="username">Почта</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ваш пароль" required>
      </div>
      <div class="form-group" id="server-group" style="display:none">
        <label for="server">Адрес сервера</label>
        <input type="url" id="server" value="https://newday.appswire.ru" placeholder="https://newday.example.com">
      </div>
      <div id="error-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <p class="auth-footer" id="reg-link">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
    <p class="auth-footer"><a href="/reset.html">Забыли пароль?</a></p>
    <!--
      Ссылка на приложение — только в браузере. Внутри самого приложения
      предлагать его скачать бессмысленно: оно уже установлено, и человек
      читает это как «вы не там, где нужно».
    -->
    <p class="auth-footer" id="get-app"><a href="/install.html">Приложение для Android</a></p>
  </div>

  <script type="module">
    /*
     * Проверка обновления и на экране входа.
     *
     * Устаревшее приложение может не суметь войти вовсе, а обновиться должно —
     * поэтому вопрос задаём до входа, а не только внутри. Адрес сервера уже
     * известен: он либо сохранён с прошлого раза, либо стоит в поле.
     */
    if (window.Capacitor?.isNativePlatform?.()) {
      // приложение уже здесь — предлагать его скачать незачем
      document.getElementById('get-app')?.remove();
      const saved = localStorage.getItem('newday.apiBase');
      if (!saved) {
        const fallback = document.getElementById('server')?.value?.trim();
        if (fallback) localStorage.setItem('newday.apiBase', fallback.replace(/\/+$/, ''));
      }
      import('/js/update.js')
        .then(u => u.check('startup'))
        .catch(() => { /* проверка обновления не должна мешать входу */ });
    }
  </script>

  <script>
    /*
     * Ссылка «Зарегистрироваться» — только когда регистрация открыта.
     * Администратор может закрыть её и впускать по приглашениям; вести
     * человека на форму, которая откажет после заполнения, — издевательство.
     * Ответа не дождались — ссылку не трогаем: без сети хуже не делаем.
     */
    (() => {
      // в приложении API живёт на сервере, а не на localhost вебвью
      const cfgBase = window.Capacitor?.isNativePlatform?.()
        ? (localStorage.getItem('newday.apiBase') || 'https://newday.appswire.ru').replace(/\/+$/, '')
        : '';
      fetch(cfgBase + '/api/v1/auth/config').then(r => r.json()).then(c => {
        if (c && c.registrationOpen === false) document.getElementById('reg-link')?.remove();
      }).catch(() => {});
    })();

    // Поле адреса сервера нужно только в приложении: на сайте адрес и так известен,
    // а на self-host человек указывает свой
    if (window.Capacitor?.isNativePlatform?.()) {
      document.getElementById('server-group').style.display = 'grid';
      const saved = localStorage.getItem('newday.apiBase');
      if (saved) document.getElementById('server').value = saved;
    }

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      // кнопка занята, пока запрос в пути: на медленной сети каждое повторное
      // нажатие входило бы ещё раз и плодило токены устройства — список
      // «Устройства» зарастал бы дублями «Android»
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn?.disabled) return;
      if (btn) btn.disabled = true;
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const native = Boolean(window.Capacitor?.isNativePlatform?.());
      const serverInput = document.getElementById('server');
      const base = native
        ? (serverInput?.value || 'https://newday.appswire.ru').replace(/\/+$/, '')
        : '';
      if (native) localStorage.setItem('newday.apiBase', base);

      const body = {
        emailOrUsername: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
        ...(native ? { issueDeviceToken: true, deviceName: 'Android', platform: 'android' } : {}),
      };

      /*
       * Отказ сети ловим и называем. Без этого fetch падал молча: обработчик
       * обрывался, и на экране не появлялось ничего — человек нажимал «Войти»
       * и получал тишину, не понимая даже, нажалась ли кнопка.
       */
      let res;
      let data = {};
      try {
        res = await fetch(base + '/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        data = await res.json().catch(() => ({}));
      } catch {
        errEl.textContent = native
          ? 'Не получилось связаться с сервером. Проверьте адрес и интернет: ' + base
          : 'Не получилось связаться с сервером. Проверьте интернет и попробуйте снова';
        errEl.style.display = 'block';
        if (btn) btn.disabled = false;
        return;
      }

      if (res.ok) {
        // в приложении сессии нет — живём на токене устройства
        if (data.deviceToken) localStorage.setItem('newday.deviceToken', data.deviceToken);
        // одна веб-версия на всё: на телефоне она сама раскладывается иначе
        window.location.replace('/web.html');
      } else {
        // сервер отвечает { error: { code, message } }
        errEl.textContent = data.error?.message || data.error || 'Ошибка входа';
        errEl.style.display = 'block';
        if (btn) btn.disabled = false;
      }
    });
  </script>
</body>
</html>
