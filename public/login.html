<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — NewDay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2E7BE4">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    try { var t = localStorage.getItem('newday.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-icon" src="/icons/logo-256.png" alt="NewDay" width="88" height="88">
      <h1 class="auth-logo-title">NewDay</h1>
      <p class="auth-logo-sub">Личный планировщик</p>
    </div>

    <form id="login-form" class="auth-form" autocomplete="on">
      <div class="form-group">
        <label for="username">Почта</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ваш пароль" required>
      </div>
      <div id="error-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <p class="auth-footer">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
    <p class="auth-footer"><a href="/reset.html">Забыли пароль?</a></p>
    <p class="auth-footer"><a href="/install.html">Приложение для Android</a></p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const body = {
        emailOrUsername: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      };

      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        window.location.replace('/app.html');
      } else {
        // сервер отвечает { error: { code, message } }
        errEl.textContent = data.error?.message || data.error || 'Ошибка входа';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
