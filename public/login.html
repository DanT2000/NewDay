<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — NewDay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-icon">☀️</span>
      <h1 class="auth-logo-title">NewDay</h1>
      <p class="auth-logo-sub">Личный планировщик</p>
    </div>

    <form id="login-form" class="auth-form" autocomplete="on">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Ваш логин" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Ваш пароль" required>
      </div>
      <div id="error-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <p class="auth-footer">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      const body = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      };

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json();
      if (res.ok) {
        window.location.replace('/app.html');
      } else {
        errEl.textContent = data.error || 'Ошибка входа';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
