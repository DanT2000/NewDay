<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — NewDay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f3f5fe">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script src="/js/boot-theme.js"></script>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img class="auth-logo-icon" src="/icons/logo-light-256.png" alt="NewDay" width="88" height="88">
      <h1 class="auth-logo-title">NewDay</h1>
      <p class="auth-logo-sub">Создать аккаунт</p>
    </div>

    <form id="register-form" class="auth-form" autocomplete="on">
      <div class="form-group">
        <label for="username">Почта</label>
        <input type="email" id="username" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Минимум 8 символов" minlength="8" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Повтор пароля</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Повторите пароль" required>
      </div>
      <!--
        Поле адреса сервера — как на входе. В приложении ассеты вшиты в APK, и
        своего сервера у страницы нет: без явного адреса регистрация уходила
        в никуда.
      -->
      <!--
        Свой сервер — по кнопке, а не полем на виду.

        Почти все пользуются нашим, и поле с адресом на входе пугает: человек
        видит его и думает, что должен что-то заполнить. Поэтому по умолчанию
        внизу одна строчка «Сервер: newday.appswire.ru», и только тем, у кого
        свой, она разворачивается в поле.
      -->
      <div class="form-group" id="server-group" hidden>
        <label for="server">Адрес своего сервера</label>
        <input type="url" id="server" value="https://newday.appswire.ru" placeholder="https://newday.example.com">
        <p class="form-hint">Полный адрес с https:// — тот, где стоит ваш NewDay</p>
      </div>
      <div id="error-msg" class="form-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>

    <p class="auth-footer" id="server-line" hidden>
      Сервер: <b id="server-now">newday.appswire.ru</b> ·
      <button type="button" class="link-btn" id="server-switch">свой сервер</button>
    </p>
    <p class="auth-footer">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
  </div>

  <script>
    /*
     * Регистрация в приложении и в браузере ходит по разным адресам.
     *
     * В браузере страница лежит на самом сайте, и относительный путь верен.
     * В приложении ассеты вшиты в APK, origin — https://localhost, и тот же
     * относительный путь уходил в никуда: запрос падал сетевой ошибкой,
     * которую никто не ловил, и на экране не появлялось вообще ничего.
     * Человек нажимал «Зарегистрироваться» и получал тишину.
     */
    const native = Boolean(window.Capacitor?.isNativePlatform?.());
    // внутри приложения предлагать его скачать незачем
    if (native) document.getElementById('get-app')?.remove();

    /*
     * Свой сервер прячется, пока не понадобится.
     *
     * Строчка «Сервер: newday.appswire.ru · свой сервер» стоит под формой:
     * тем, кто пользуется нашим, ничего заполнять не надо, а у кого свой —
     * одно нажатие разворачивает поле. Прежнее поле на виду читалось как
     * обязательное и пугало на первом же экране.
     *
     * Показываем строчку только в приложении: в браузере страница уже лежит
     * на нужном сервере, и выбирать нечего.
     */
    if (native) {
      const line = document.getElementById('server-line');
      const group = document.getElementById('server-group');
      const input = document.getElementById('server');
      const now = document.getElementById('server-now');
      const DEFAULT_BASE = 'https://newday.appswire.ru';
      const saved = (localStorage.getItem('newday.apiBase') || '').replace(/\/+$/, '');
      if (saved) input.value = saved;

      const host = url => String(url || '').replace(/^https?:\/\//, '').replace(/\/+$/, '');
      now.textContent = host(saved || DEFAULT_BASE);
      line.hidden = false;
      // адрес уже свой — поле открыто сразу: человек его и так задал
      if (saved && saved !== DEFAULT_BASE) group.hidden = false;

      document.getElementById('server-switch').addEventListener('click', () => {
        group.hidden = !group.hidden;
        if (!group.hidden) input.focus();
      });
      input.addEventListener('input', () => {
        now.textContent = host(input.value) || host(DEFAULT_BASE);
      });
    }

    /*
     * Приглашение приезжает в ссылке: /register.html?invite=КОД.
     * Когда регистрация закрыта, без кода форма бессмысленна — говорим об
     * этом сразу, а не отказом после заполненных полей.
     */
    const inviteCode = new URLSearchParams(location.search).get('invite') || '';
    (() => {
      const cfgBase = native
        ? (localStorage.getItem('newday.apiBase') || 'https://newday.appswire.ru').replace(/\/+$/, '')
        : '';
      fetch(cfgBase + '/api/v1/auth/config').then(r => r.json()).then(c => {
        if (c && c.registrationOpen === false && !inviteCode) {
          document.querySelector('.auth-form').outerHTML =
            '<p class="auth-footer">Регистрация здесь — по приглашениям. '
            + 'Попросите ссылку у администратора: в ней уже есть код, и форма откроется сама.</p>';
        }
      }).catch(() => {});
    })();

    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      // кнопка занята на время запроса: повторное нажатие на медленной сети
      // регистрировало бы дважды и плодило токены устройства
      const btn = e.target.querySelector('button[type="submit"]');
      if (btn?.disabled) return;
      if (btn) btn.disabled = true;
      const errEl = document.getElementById('error-msg');
      const show = text => {
        errEl.textContent = text;
        errEl.style.display = 'block';
        if (btn) btn.disabled = false;
      };
      errEl.style.display = 'none';

      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirmPassword').value) {
        show('Пароли не совпадают');
        return;
      }

      const serverInput = document.getElementById('server');
      const base = native
        ? (serverInput?.value || 'https://newday.appswire.ru').replace(/\/+$/, '')
        : '';
      if (native) localStorage.setItem('newday.apiBase', base);

      let res;
      let data = {};
      try {
        res = await fetch(base + '/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email,
            password,
            // код из ссылки-приглашения; пустой сервер просто не заметит
            ...(inviteCode ? { invite: inviteCode } : {}),
            /*
             * Приложению нужен свой токен: cookie кросс-доменно не пройдут, и
             * без токена сразу после регистрации всё упиралось бы в «не вошли».
             */
            ...(native ? { issueDeviceToken: true, deviceName: 'Android', platform: 'android' } : {}),
          }),
        });
        data = await res.json().catch(() => ({}));
      } catch (err) {
        // Молчаливый отказ хуже любого сообщения: человек не знает, что делать
        show(native
          ? 'Не получилось связаться с сервером. Проверьте адрес и интернет: ' + base
          : 'Не получилось связаться с сервером. Проверьте интернет и попробуйте снова');
        return;
      }

      if (!res.ok) {
        show(data.error?.message || data.error || `Ошибка регистрации (${res.status})`);
        return;
      }
      if (data.deviceToken) localStorage.setItem('newday.deviceToken', data.deviceToken);

      if (data.needsVerification) {
        document.querySelector('.auth-form').outerHTML =
          '<p class="auth-footer">Письмо отправлено на <b>' + email +
          '</b>. Перейдите по ссылке из письма, чтобы подтвердить адрес и войти.</p>';
      } else {
        // одна веб-версия на всё: на телефоне она сама раскладывается иначе
        window.location.replace('/web.html');
      }
    });
  </script>
</body>
</html>
